#cloud-config
packages:
  - curl
  - git
  - make
  - sysstat
runcmd:
  - |
    set -eux
    export HOME=/root GOPATH=/root/go GOCACHE=/root/.cache/go-build
    curl -fsSL https://go.dev/dl/go1.21.2.linux-arm64.tar.gz | tar -xz -C /usr/local
    git clone https://github.com/isucon/isucon13.git /opt/isucon13
    git -C /opt/isucon13 checkout 8f6afdc3603f0c661368de4659a7240862f59623
    cd /opt/isucon13/bench
    /usr/local/go/bin/go build -o /opt/bench ./cmd/bench
    echo ready > /opt/bench-ready
