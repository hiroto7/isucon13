#cloud-config

timezone: Asia/Tokyo

packages:
  - ansible
  - curl
  - git
  - gnupg
  - make
  - openssh-server
  - openssl
  - snapd
  - sudo

runcmd:
  - |
    set -ex

    export HOME="/root"
    GITDIR="/tmp/isucon13"

    mkdir -p /etc/apt/keyrings
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    NODE_MAJOR=20
    echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_$NODE_MAJOR.x nodistro main" > /etc/apt/sources.list.d/nodesource.list

    apt-get update
    apt-get install -y --no-install-recommends nodejs

    # OrbStack環境では1回目は失敗するので最大2回実施する
    snap install go --channel=1.21/stable --classic || snap install go --channel=1.21/stable --classic
    . /etc/profile.d/apps-bin-path.sh

    rm -rf ${GITDIR}
    git clone https://github.com/isucon/isucon13.git ${GITDIR}
    git -C ${GITDIR} checkout 8f6afdc3603f0c661368de4659a7240862f59623

    # Local VM adaptation: keep original domains and verification, disable AWS discovery.
    sed -i -e "/enabled/s/true/false/" ${GITDIR}/provisioning/ansible/roles/globalip/tasks/main.yml
    # Only Go is used; skip installation and compilation of six unused runtimes.
    printf '%s\n' '---' '[]' > ${GITDIR}/provisioning/ansible/roles/xbuildwebapp/tasks/main.yml
    python3 - <<'LOCALPY'
    from pathlib import Path
    p = Path('/tmp/isucon13/provisioning/ansible/roles/webapp/tasks/main.yaml')
    s = p.read_text()
    s = s[:s.index('- name: Tasks for isupipe-node')]
    p.write_text(s)
    LOCALPY
    # amd64以外でも動作するように
    sed -i -e "/go-install/s/$/ `uname -s | tr 'A-Z' 'a-z'` `dpkg --print-architecture`/" ${GITDIR}/provisioning/ansible/roles/xbuild/tasks/main.yml
    sed -i -e "s/_linux_amd64//" ${GITDIR}/provisioning/ansible/roles/bench/tasks/main.yaml
    sed -i -e 's/\$(LINUX_TARGET_ENV)//' ${GITDIR}/webapp/go/Makefile
    (

      cd ${GITDIR}/bench
      go build -o ../provisioning/ansible/roles/bench/files/bench -buildvcs=false ./cmd/bench
    )
    (
      cd ${GITDIR}/frontend
      npm install -g corepack
      make
      npm uninstall corepack
      cp -r ./dist/ ../webapp/public/
    )
    (
      cd ${GITDIR}/envcheck
      CGO_ENABLED=0 go build -o ../provisioning/ansible/roles/envcheck/files/envcheck -buildvcs=false -ldflags "-s -w"
    )
    (
      cd ${GITDIR}
      tar zcf provisioning/ansible/roles/webapp/files/webapp.tar.gz webapp
    )
    (
      cd ${GITDIR}/provisioning/ansible
      ansible-playbook -i inventory/localhost application.yml
      ansible-playbook -i inventory/localhost benchmark.yml
    )
    # Renew local TLS certificate and install it as trusted CA for the benchmark VM.
    openssl req -x509 -nodes -newkey rsa:2048 -days 3650 -subj '/CN=ISUCON13 local' -addext 'subjectAltName=DNS:*.u.isucon.dev,DNS:u.isucon.dev' -keyout /etc/nginx/tls/_.u.isucon.dev.key -out /etc/nginx/tls/_.u.isucon.dev.crt
    cp /etc/nginx/tls/_.u.isucon.dev.crt /etc/nginx/tls/_.u.isucon.dev.issuer.crt
    systemctl reload nginx
    rm -rf ${GITDIR}
    apt-get purge -y ansible nodejs
    apt-get autoremove -y

    rm -f /etc/apt/sources.list.d/nodesource.list
    rm -f /etc/apt/keyrings/nodesource.gpg

    snap remove go
    echo ok
